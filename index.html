<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cathay Pacific — In-Flight Experience</title>
  <meta name="description" content="Cathay Pacific IFE boot screen with 3D globe flight animation">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&family=Roboto+Mono:wght@400;700&family=Noto+Sans+TC:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== Sweep Transition Overlay ========== -->
  <div id="sweep-transition" class="sweep-transition">
    <img src="assets/cathay-logo.svg" class="sweep-brushwing" alt="Cathay Pacific">
  </div>

  <!-- ========== SCENE 0: Tap to Start ========== -->
  <div id="start-screen" class="start-screen">
    <div class="start-content">
      <img src="assets/cathay-logo.svg" class="start-logo" alt="Cathay Pacific">
      <div class="start-text">輕觸螢幕開始</div>
      <div class="start-pulse-ring"></div>
    </div>
  </div>

  <!-- ========== SCENE 1-3: Globe Layer ========== -->
  <div id="globe-container" class="globe-container hidden-scene" style="display:none"></div>

  <!-- ========== Starfield Canvas ========== -->
  <canvas id="starfield" class="starfield"></canvas>

  <!-- ========== Globe Scene HUD Overlay ========== -->
  <!-- This is the "earth in bottom half / text in black space" overlay from the video -->
  <div id="globe-hud" class="globe-hud">

    <!-- Top: Brushwing logo (small, centered) -->
    <div class="globe-hud-logo">
      <img src="assets/cathay-logo.svg" class="globe-brushwing-svg" alt="Cathay Pacific">
    </div>

    <!-- Center: "Enjoy your flight to" + animated destination name -->
    <div class="globe-hud-center">
      <div class="globe-enjoy-label" id="globe-enjoy-label">Enjoy your journey</div>
      <!-- Destination name -->
      <div class="globe-dest-text" id="globe-dest-text">TORONTO</div>
    </div>

  </div>

  <!-- Audio for background music -->
  <audio id="bg-audio" src="assets/26436501555-1-30280.mp4" preload="auto" loop></audio>

  <!-- ========== Split-Flap Scene (Departure Board) ========== -->
  <div id="flap-scene" class="flap-scene hidden-scene" style="display:none">
    <header class="flap-header">
      <div class="flap-header-logo">
        <img src="assets/cathay-logo.svg" class="flap-logo-svg" alt="Cathay Pacific">
      </div>
      <div class="flap-departures-badge">
        <span class="dep-dot"></span>
        <span class="dep-text">DEPARTURES</span>
      </div>
    </header>

    <main class="flap-board">
      <section class="flap-section">
        <div class="flap-label">FLIGHT</div>
        <div class="flap-row" id="flap-row-flight" data-row="flight"></div>
      </section>
      <section class="flap-section">
        <div class="flap-label">FROM</div>
        <div class="flap-row" id="flap-row-from" data-row="from"></div>
      </section>
      <section class="flap-section flap-section--hero">
        <div class="flap-label flap-label--hero">DESTINATION</div>
        <div class="flap-row flap-row--hero" id="flap-row-to" data-row="to"></div>
      </section>
      <section class="flap-section">
        <div class="flap-label">GATE</div>
        <div class="flap-row" id="flap-row-gate" data-row="gate"></div>
      </section>
      <section class="flap-section">
        <div class="flap-label">STATUS</div>
        <div class="flap-row flap-row--status" id="flap-row-status" data-row="status"></div>
      </section>
    </main>

    <footer class="flap-footer">
      <span class="flap-touch-hint" id="flap-touch-hint">▶ TAP FOR NEXT FLIGHT</span>
      <span class="flap-time" id="flap-time">--:--</span>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.2/dist/globe.gl.min.js"></script>
  <script src="js/globe-scene.js"></script>
  <script src="js/split-flap.js"></script>
  <script src="js/destinations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
