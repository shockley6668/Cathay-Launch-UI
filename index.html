<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cathay Pacific — In-Flight Experience</title>
  <meta name="description" content="Cathay Pacific IFE boot screen with 3D globe flight animation">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&family=Roboto+Mono:wght@400;700&family=Noto+Sans+TC:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Error display for debugging -->
  <div id="debug-error" style="position:fixed; top:10px; left:10px; z-index:9999; color:red; background:rgba(0,0,0,0.8); padding:10px; display:none; max-width: 90vw; font-family: monospace; white-space: pre-wrap;"></div>
  <script>
    window.addEventListener('error', function(e) {
      var d = document.getElementById('debug-error');
      d.style.display = 'block';
      d.innerHTML += '[' + new Date().toISOString() + '] ' + e.message + ' at ' + e.filename + ':' + e.lineno + '<br>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.getElementById('debug-error');
      d.style.display = 'block';
      d.innerHTML += '[' + new Date().toISOString() + '] Promise Rejection: ' + (e.reason ? e.reason.message : e.reason) + '<br>';
    });
    // Override console.error
    var oldErr = console.error;
    console.error = function() {
      var d = document.getElementById('debug-error');
      d.style.display = 'block';
      d.innerHTML += '[' + new Date().toISOString() + '] Console Error: ' + Array.from(arguments).join(' ') + '<br>';
      oldErr.apply(console, arguments);
    };
  </script>

  <!-- ========== Sweep Transition Overlay ========== -->
  <div id="sweep-transition" class="sweep-transition">
    <img src="assets/cathay-logo.svg" class="sweep-brushwing" alt="Cathay Pacific">
  </div>

  <!-- ========== SCENE 0: Language Selection ========== -->
  <div id="start-screen" class="start-screen">
    <div class="start-bg" style="background-image: url('assets/mountain_road.png');"></div>
    <div class="start-overlay"></div>
    <div class="lang-content">
      <h1 class="lang-title">Languages</h1>
      <ul class="lang-list">
        <li>English</li>
        <li>繁體中文</li>
        <li>簡體中文</li>
        <li>日本語</li>
        <li>한국어</li>
        <li>Français</li>
        <li>Deutsch</li>
        <li>Kids</li>
      </ul>
    </div>
  </div>

  <!-- ========== SCENE 1-3: Globe Layer ========== -->
  <div id="globe-container" class="globe-container hidden-scene"></div>

  <!-- ========== Starfield Canvas ========== -->
  <canvas id="starfield" class="starfield"></canvas>

  <!-- ========== Globe Scene HUD Overlay ========== -->
  <div id="globe-hud" class="globe-hud">
    <div class="globe-hud-content">
      <div class="globe-hud-logo">
        <img src="assets/cathay-logo.svg" class="globe-brushwing-svg" alt="Cathay Pacific">
      </div>
      <!-- Center text area (used for both rolling text and final destination) -->
      <div class="globe-hud-center">
        <div class="rolling-subtitle" id="rolling-subtitle">Enjoy your flight to</div>
        <!-- Rolling Text -->
        <div class="rolling-text-container" id="rolling-text-container"></div>
        
        <!-- Final Text (Hidden initially) -->
        <div class="final-text-container" id="final-text-container" style="display:none;">
          <div class="globe-enjoy-label">Enjoy your journey</div>
          <div class="globe-dest-text" id="globe-dest-text">TORONTO</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio for background music -->
  <audio id="bg-audio" src="assets/26436501555-1-30280.mp4" preload="auto" loop></audio>

  <!-- Scripts -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.2/dist/globe.gl.min.js"></script>
  <script src="js/globe-scene.js"></script>
  <script src="js/destinations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
